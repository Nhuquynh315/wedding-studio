[project]
name = "wedding-studio-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Auth
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "werkzeug>=3.1",
    # Validation / settings
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "black",
    "pre-commit",
]

[tool.setuptools.packages.find]
include = ["app*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() in default args is intentional

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

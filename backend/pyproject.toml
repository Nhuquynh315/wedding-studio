[project]
name = "wedding-studio-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1",
    "flask-limiter>=4.1",
    "flask-login>=0.6",
    "flask-migrate>=4.1",
    "flask-sqlalchemy>=3.1",
    "flask-wtf>=1.2",
    "werkzeug>=3.1",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "openpyxl>=3.1",
    "weasyprint>=68.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "black",
    "pre-commit",
]

[tool.setuptools.packages.find]
include = ["app*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() in default args is intentional

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
